[package]
name = "test_cases"
edition = "2021"

[features]
host = ["dep:futures"]  # libkrun is now always included
guest = []

[lib]
name = "test_cases"

[dependencies]
# libkrun is needed for nested-virt test where L1 guest builds L2 VM
# Always include it so nested-virt L1 code can use the Builder API
libkrun = { path = "../../src/libkrun", features = ["embedded_init", "net", "blk", "snapshot", "vhost-user", "uffd"] }
macros = { path = "../macros" }
nix = { version = "0.29.0", features = ["socket"] }
libc = "0.2"
anyhow = "1.0.95"
tempdir = "0.3.7"
tokio = { version = "1", features = ["sync", "time"] }
futures = { version = "0.3", optional = true }
bytes = "1"
pnet = "0.35"
