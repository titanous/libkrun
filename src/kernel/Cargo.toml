[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
vm-memory = { version = "0.18", features = ["backend-mmap"] }

utils = { path = "../utils" }

[lints.rust]
# `kani` is used for bounded model checking proofs; not a Cargo feature.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
