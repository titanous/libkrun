[package]
name = "libkrun"
version = "1.17.3"
authors = ["The libkrun Authors"]
edition = "2021"
build = "build.rs"

[features]
default = ["dynamic-firmware"]
dynamic-firmware = ["dep:libloading"]
tee = ["vmm/tee"]
amd-sev = [ "blk", "tee", "vmm/amd-sev" ]
tdx = [ "blk", "tee", "vmm/tdx" ]
snapshot = [ "vmm/snapshot", "hvf/snapshot", "tokio" ]
net = [ "devices/net", "vmm/net" ]
blk = [ "devices/blk", "vmm/blk" ]
efi = [ "blk", "net", "vmm/efi" ]
gpu = ["krun_display", "vmm/gpu", "devices/gpu"]
snd = ["vmm/snd", "devices/snd"]
input = ["krun_input", "vmm/input", "devices/input"]
virgl_resource_map2 = []
aws-nitro = [ "dep:aws-nitro", "dep:nitro-enclaves" ]
# Embed the init binary. Disable if you provide a custom init.
embedded_init = ["devices/embedded_init"]
vhost-user = ["vmm/vhost-user", "devices/vhost-user"]
uffd = ["vmm/uffd"]
# Link libkrunfw statically instead of dlopen. Used for static musl binaries
# (e.g. guest-agent in nested virt tests) that cannot use dlopen.
static-firmware = []

[dependencies]
crossbeam-channel = ">=0.5.15"
libc = ">=0.2.39"
libloading = { version = "0.8", optional = true }
log = "0.4.0"
krun_display = { path = "../krun_display", optional = true, features = ["bindgen_clang_runtime"] }
krun_input = { path = "../krun_input", optional = true, features = ["bindgen_clang_runtime"] }

devices = { path = "../devices", features = ["snapshot"] }
mutants = "0.0.3"
polly = { path = "../polly" }
utils = { path = "../utils" }
vmm = { path = "../vmm" }
thiserror = "1"
tokio = { version = "1", features = ["rt", "macros"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
hvf = { path = "../hvf" }

[target.'cfg(target_os = "linux")'.dependencies]
kvm-bindings = { version = ">=0.11", features = ["fam-wrappers"] }
kvm-ioctls = ">=0.21"
aws-nitro = { path = "../aws_nitro", optional = true }
nitro-enclaves = { version = "0.5.0", optional = true }
vm-memory = { version = "0.18", features = ["backend-mmap"] }

[dev-dependencies]
proptest = "1.4"

[lib]
name = "krun"
crate-type = ["lib"]
