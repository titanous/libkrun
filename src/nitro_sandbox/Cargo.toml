[package]
name = "nitro_sandbox"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
devices = ["dep:devices", "dep:utils", "dep:vm-memory", "dep:polly"]

[dependencies]
devices = { path = "../devices", features = ["blk"], optional = true }
utils = { path = "../utils", optional = true }
polly = { path = "../polly", optional = true }
vm-memory = { version = "0.18", features = ["backend-mmap"], optional = true }

[[example]]
name = "devices"
required-features = ["devices"]

[workspace]
