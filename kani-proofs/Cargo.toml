[package]
name = "kani-proofs"
version = "0.1.0"
edition = "2021"
publish = false

# This package is NOT a member of the root workspace.
# It is invoked only via: cargo kani --manifest-path kani-proofs/Cargo.toml
# Running `cargo build` at the workspace root does NOT compile this package.

[workspace]
# Empty workspace declaration to make this package standalone


[dependencies]
vmm = { path = "../src/vmm", features = ["snapshot", "uffd"] }
devices = { path = "../src/devices", features = ["net"] }
arch = { path = "../src/arch" }

[patch.crates-io]
linux-loader = { git = "https://github.com/theoparis/linux-loader", rev = "af90928dcfa1666d47a5269061ef77857eff46d3" }
vhost = { path = "../vendor/vhost" }
tdx = { path = "../vendor/tdx" }
