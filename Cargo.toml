[workspace]
members = ["src/libkrun", "src/krun_input"]
exclude = ["examples/gtk_display", "fuzz"]
resolver = "2"

[profile.dev]
#panic = "abort"

[profile.release]
#panic = "abort"
lto = true

[profile.profiling]
inherits = "release"
debug = true
lto = false

[patch.crates-io]
linux-loader = { path = "vendor/linux-loader" }
vhost = { path = "vendor/vhost" }
tdx = { path = "vendor/tdx" }
